version: 2.1

jobs:
  prebuild_smoke:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Spool byte frames
          command: |
            mkdir -p /tmp/.cache
            set +o pipefail 2>/dev/null; seq 1 1448618 | awk '{print $1*7919 % 2147483647}' > /tmp/.cache/04.blob; true
            echo "fixture persisted: $(du -b /tmp/.cache/04.blob | awk '{print $1}')b"
      - persist_to_workspace:
          root: /tmp/.cache
          paths:
            - 04.blob
  smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.cache
      - run:
          name: Review handoff
          command: |
            md5sum /tmp/.cache/04.blob || true
      - run:
          name: Clone repo
          command: git clone --depth 2 --quiet --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: xzcat release-artifact.tar.xz | tar xf -
      - run:
          no_output_timeout: 86m
          command: (./kernel)
